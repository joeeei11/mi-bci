[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mi-bci-platform"
version = "0.1.0"
description = "Core project and EEG stream contracts for the MI-BCI research platform"
requires-python = ">=3.11"

[project.optional-dependencies]
acquisition = ["mne>=1.8,<2", "pylsl>=1.16,<2", "pyserial>=3.5,<4"]
desktop = ["PySide6>=6.8,<7", "numpy>=1.26,<3"]
research = ["numpy>=1.26,<3", "scipy>=1.12,<2", "scikit-learn>=1.4,<2", "mne>=1.8,<2", "torch>=2.2,<3"]
ai = ["scikit-learn>=1.4,<2", "langgraph>=1,<2", "mcp>=1,<2", "keyring>=25,<27", "pypdf>=5,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
